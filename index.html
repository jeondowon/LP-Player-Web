<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vinyl Room</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-title">Vinyl Room</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
    <div class="loading-sub">Setting the mood...</div>
  </div>

  <!-- Three.js Canvas -->
  <canvas id="three-canvas"></canvas>
  <div id="room-overlay"></div>
  <div id="hint">drag to rotate · scroll to zoom</div>

  <!-- Hidden YouTube Player -->
  <div id="yt-container"><div id="yt-player"></div></div>

  <!-- Playlist Panel -->
  <div id="playlist-panel">
    <div class="panel-header">
      <span class="panel-title">Playlist</span>
      <button class="icon-btn" id="clear-btn">✕</button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search music on YouTube..." />
      <button id="search-btn">Search</button>
    </div>
    <div id="search-results"></div>
    <div id="playlist-tracks">
      <div class="playlist-empty">Search for tracks above<br />and build your playlist.</div>
    </div>
  </div>

  <!-- Now Playing -->
  <div id="now-playing">
    <div id="np-controls">
      <img class="np-art" id="np-art" src="" alt="" />
      <div class="np-info">
        <div class="np-track" id="np-track">—</div>
        <div class="np-artist" id="np-artist">—</div>
      </div>
      <button class="ctrl-btn" id="prev-btn">⏮</button>
      <button id="play-btn">▶</button>
      <button class="ctrl-btn" id="next-btn">⏭</button>
      <div id="vol-wrap">
        <span id="vol-icon">
          <svg id="vol-svg" viewBox="0 0 24 24">
            <polygon id="vol-speaker" points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path id="vol-wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path id="vol-wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            <line id="vol-mute-line" x1="1" y1="1" x2="23" y2="23" style="display:none" />
          </svg>
        </span>
        <input type="range" id="vol-slider" min="0" max="100" value="80" />
      </div>
    </div>
    <div id="np-progress-wrap">
      <span id="np-time-cur">0:00</span>
      <input type="range" id="np-progress" min="0" max="100" value="0" step="0.1" />
      <span id="np-time-tot">0:00</span>
    </div>
  </div>

  <!-- LP Shelf -->
  <div id="lp-shelf">
    <div class="shelf-label">Now in playlist</div>
    <div id="shelf-track"></div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/player.js"></script>
  <script src="js/scene.js"></script>

</body>
</html>
